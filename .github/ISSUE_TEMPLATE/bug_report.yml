---
name: バグレポート
description: バグの修正に役立つレポートを作成します
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        このバグを報告するために時間を割いていただき、ありがとうございます！これにより、やり取りを最小限に抑え、問題の原因を迅速に見つけることができます。
  - type: checkboxes
    attributes:
      label: バグレポートを送信する前に
      options:
        - label: '[Continueのドキュメントサイト](https://docs.continue.dev/)で回答を探してみました'
          required: false
        - label: '同じバグを報告している[オープンなIssue](https://github.com/Schwarzemona/continue/issues?q=is%3Aopen+is%3Aissue)を見つけられませんでした'
          required: false
        - label: 'Continueドキュメントの[トラブルシューティングガイド](https://docs.continue.dev/troubleshooting)を確認しました'
          required: false
  - type: textarea
    attributes:
      label: 関連する環境情報
      description: |
        問題に関連しない情報は省略していただいて構いません。

        - **OS**: macOS
        - **Continue version**: v0.9.4
        - **IDE version**:  VSCode 1.85.1
        - Model: Claude Sonnet 4.5
        - Agent configuration
      value: |
        - OS:
        - Continue version:
        - IDE version:
        - Model:
        - config:
          ```yaml

          ```
      render: Markdown
    validations:
      required: false
  - type: textarea
    attributes:
      label: 説明
      description: |
        バグについて、明確かつ簡潔な説明を提供してください
      placeholder: |
        短い説明
    validations:
      required: false
  - type: textarea
    attributes:
      label: 再現手順
      description: 問題を再現するための手順。可能であれば、より分かりやすくするためにgif、スクリーンショット、または動画を含めてください。
      placeholder: |
        1. …に移動する
        2. …をクリックする
        3. …までスクロールする
        4. エラーを確認する
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: ログ出力
      description: |
        ログの取得方法については、Continueドキュメントの[トラブルシューティングガイド](https://docs.continue.dev/troubleshooting)を参照してください。関連する行、または最後の100行程度をコピーしてください。
      render: Shell
